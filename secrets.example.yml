---
# Template for inventories/<env>/group_vars/onebox/secrets.yml (gitignored).
# `make init ENV=<name>` copies it into place; fill values with
#   make secrets-gen KEY=<name>    random value
#   make secrets-set KEY=<name>    paste a value (no echo, no shell history)
#   make secrets-missing           keys still holding a placeholder
# preflight refuses to deploy a component while one of its keys starts with CHANGE-ME.
# Encrypt the real file with ansible-vault if you like and deploy with VAULT=1.

# ── Argo CD (component: argocd) ──────────────────────────────────────────────────────
# OIDC client registered at the identity provider (onebox_oidc_clients.argocd).
argocd_oidc_client_id: "CHANGE-ME-argocd-oidc-client-id"
argocd_oidc_client_secret: "CHANGE-ME-argocd-oidc-client-secret"
# One key per entry of argocd_repo_credentials, named by that entry's password_var, e.g. a
# GitLab deploy token with read_repository:
# argocd_repo_demo_gitops_token: "CHANGE-ME-deploy-token"

# ── k3s (component: k3s) ─────────────────────────────────────────────────────────────
# Only when k3s_registry_username is set: node-wide pull token for the GitLab registry
# (deploy token with read_registry).
# k3s_registry_password: "CHANGE-ME-registry-token"
