---
# Template for inventories/<env>/group_vars/onebox/secrets.yml (gitignored).
# `make init ENV=<name>` copies it into place; fill values with
#   make secrets-gen KEY=<name>    random value
#   make secrets-set KEY=<name>    paste a value (no echo, no shell history)
#   make secrets-missing           keys still holding a placeholder
# preflight refuses to deploy a component while one of its keys starts with CHANGE-ME.
# Encrypt the real file with ansible-vault if you like and deploy with VAULT=1.

# ── Argo CD (component: argocd) ──────────────────────────────────────────────────────
# OIDC client registered at the identity provider (onebox_oidc_clients.argocd).
argocd_oidc_client_id: "CHANGE-ME-argocd-oidc-client-id"
argocd_oidc_client_secret: "CHANGE-ME-argocd-oidc-client-secret"
# One key per entry of argocd_repo_credentials, named by that entry's password_var, e.g. a
# GitLab deploy token with read_repository:
# argocd_repo_demo_gitops_token: "CHANGE-ME-deploy-token"

# ── k3s (component: k3s) ─────────────────────────────────────────────────────────────
# Only when k3s_registry_username is set: node-wide pull token for the GitLab registry
# (deploy token with read_registry).
# k3s_registry_password: "CHANGE-ME-registry-token"

# ── Datastores (component: datastores) ───────────────────────────────────────────────
datastores_postgres_superuser_password: "CHANGE-ME-postgres-superuser"
# URL-safe characters only (use make secrets-gen): it is embedded in Redis URLs.
datastores_redis_password: "CHANGE-ME-redis"
# Only with the engine enabled:
# datastores_mysql_root_password: "CHANGE-ME-mysql-root"
# datastores_nats_password: "CHANGE-ME-nats"
# datastores_etcd_root_password: "CHANGE-ME-etcd-root"
# One key per password_var in datastores_postgres_databases / datastores_mysql_databases.

# ── Casdoor (component: casdoor) ─────────────────────────────────────────────────────
casdoor_db_password: "CHANGE-ME-casdoor-db"
# First password of built-in/admin (>= 12 characters, no blanks), applied on first start.
casdoor_admin_password: "CHANGE-ME-casdoor-admin"
# One casdoor_idp_<name>_client_secret per upstream identity provider you configure.

# ── OpenBao (component: openbao) ─────────────────────────────────────────────────────
# Auto-unseal key: make secrets-gen KEY=openbao_seal_key LENGTH=48.
# UNRECOVERABLE — copy it to your password manager the moment you create it. Without it the
# store's data cannot be decrypted. openbao_seal_previous_key exists only during a rotation.
openbao_seal_key: "CHANGE-ME-openbao-seal-key"
openbao_oidc_client_id: "CHANGE-ME-openbao-oidc-client-id"
openbao_oidc_client_secret: "CHANGE-ME-openbao-oidc-client-secret"
