---
# forge components on Debian/Ubuntu with the other branches: no host firewall management,
# admin sshd stays on 22 (no git-over-SSH), no OIDC, no registry, SMTP relay with implicit
# TLS and no authentication, accounts managed elsewhere, NFS and LABEL mounts, multi-arch.
onebox_env: test
onebox_os_family: Debian
onebox_domain: lab.example.test
onebox_host_ip: 198.51.100.20
onebox_lan_cidrs: [198.51.100.0/24]
onebox_components:
  - edge
  - operators
  - storage
  - tailscale
  - gitlab
  - gitlab-runner
common_firewall_backend: none
edge_tls_mode: internal
