---
# Files this role writes. Included by main.yml and by tests/render.yml (render mode).

- name: System directories (render mode only; they already exist on a real host)
  ansible.builtin.file:
    path: "{{ onebox_root }}{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ssh/sshd_config.d
    - /etc/sudoers.d
  when: onebox_render_only | bool

- name: Managed authorized-keys directory
  ansible.builtin.file:
    path: "{{ onebox_root }}{{ operators_keys_dir }}"
    state: directory
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0755"

# Root-owned and world-readable on purpose: sshd reads the file as the logging-in user and
# its StrictModes check accepts root-owned files in root-owned, non-writable directories.
- name: Managed keys of each operator (exclusive)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ onebox_root }}{{ operators_keys_dir }}/{{ item.name }}"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0644"
  loop: "{{ _operators_present }}"
  loop_control:
    label: "{{ item.name }} ({{ item.ssh_keys | default([]) | length }} keys)"

- name: No managed keys for removed operators and break-glass accounts
  ansible.builtin.file:
    path: "{{ onebox_root }}{{ operators_keys_dir }}/{{ item }}"
    state: absent
  loop: "{{ _operators_absent_names + operators_console_only }}"

- name: Sudo policy for the operators group
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ onebox_root }}/etc/sudoers.d/50-onebox-operators"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0440"
    validate: "{{ omit if onebox_render_only | bool else 'visudo -cf %s' }}"

# Validated on its own before it is put in place (a broken sshd config only shows at the
# next restart — often a reboot, with nobody watching); main.yml re-checks the full config.
- name: Drop-in for sshd (managed keys, break-glass DenyUsers)
  ansible.builtin.template:
    src: sshd-operators.conf.j2
    dest: "{{ onebox_root }}/etc/ssh/sshd_config.d/20-onebox-operators.conf"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0600"
    validate: "{{ omit if onebox_render_only | bool else '/usr/sbin/sshd -t -f %s' }}"
  notify: Reload sshd
