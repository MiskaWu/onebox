---
# KV v2 mount and the ACL policies. Read first, write only on a difference, so "changed" is
# honest (the API itself is idempotent and would always report success).

- name: Read the mounted secrets engines
  ansible.builtin.uri:
    url: "{{ _openbao_api }}/v1/sys/mounts"
    headers: "{{ _openbao_headers }}"
  register: _openbao_mounts
  no_log: true

- name: Mount KV v2 at {{ openbao_kv_mount }}
  ansible.builtin.uri:
    url: "{{ _openbao_api }}/v1/sys/mounts/{{ openbao_kv_mount }}"
    method: POST
    headers: "{{ _openbao_headers }}"
    body_format: json
    body:
      type: kv
      description: onebox workload secrets
      options:
        version: "2"
    status_code: [200, 204]
  changed_when: true
  no_log: true
  when: (openbao_kv_mount ~ '/') not in _openbao_mounts.json.data

- name: Read the policies
  ansible.builtin.uri:
    url: "{{ _openbao_api }}/v1/sys/policies/acl/{{ item.name }}"
    headers: "{{ _openbao_headers }}"
    status_code: [200, 404]
  loop: "{{ _openbao_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: _openbao_policy_now
  no_log: true

- name: Write the policies that differ
  ansible.builtin.uri:
    url: "{{ _openbao_api }}/v1/sys/policies/acl/{{ item.item.name }}"
    method: PUT
    headers: "{{ _openbao_headers }}"
    body_format: json
    body:
      policy: "{{ item.item.policy }}"
    status_code: [200, 204]
  loop: "{{ _openbao_policy_now.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
  no_log: true
  when: item.status == 404 or item.json.data.policy | default('') != item.item.policy
