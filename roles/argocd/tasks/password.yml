---
# Operation (make argocd-password): the initial admin password Argo CD generated. Delete the
# secret once SSO admins exist (Argo CD docs); this prints nothing when it is gone.
- name: Read the initial admin secret
  ansible.builtin.command: >-
    k3s kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret
    -o jsonpath={.data.password}
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"
  register: _argocd_initial
  changed_when: false
  failed_when: false
  no_log: true

- name: Initial admin password
  ansible.builtin.debug:
    msg: >-
      {{ ('admin / ' ~ (_argocd_initial.stdout | b64decode)) if _argocd_initial.rc == 0 and _argocd_initial.stdout | length > 0
         else 'argocd-initial-admin-secret does not exist (already deleted, or Argo CD not installed)' }}
