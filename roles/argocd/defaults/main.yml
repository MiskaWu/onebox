---
# ── Chart (https://argoproj.github.io/argo-helm) ─────────────────────────────────────
# Downloaded with the digest from the repository index and served by k3s itself (see
# roles/k3s_gateway/README.md). Upgrades: chart, sha256 and app version move together, and the
# exclusion tripwire below forces a look at the chart's shipped resource.exclusions.
argocd_chart_version: "10.10.5"
argocd_app_version: v3.5.5   # informational: the chart's appVersion
argocd_chart_url: >-
  {{ 'https://github.com/argoproj/argo-helm/releases/download/argo-cd-' ~ argocd_chart_version
     ~ '/argo-cd-' ~ argocd_chart_version ~ '.tgz' }}
argocd_chart_sha256: ba6447eeed42bc41d1f0527721047b236304e97669a7b6286d02be4a1644ba7a

# Tripwire (ADR 0012, 0023). The platform replaces the chart's resource.exclusions wholesale to
# let Argo CD manage EndpointSlices (selectorless Services for the data network). From then on
# our copy wins, also after chart upgrades — silently. This records the chart version whose
# shipped list was last compared with ours (vars/main.yml); the preflight refuses a chart
# version that differs. On a bump: compare `configs.cm."resource.exclusions"` in the new
# chart's values.yaml with _argocd_resource_exclusions, carry over upstream changes (keeping
# EndpointSlice allowed), then set this to the new version.
argocd_exclusions_reviewed_for: "10.10.5"
# Additional exclusions of your own, appended to the list.
argocd_resource_exclusions_extra: []

argocd_namespace: argocd

# ── Access path: edge → gateway → Ingress → argocd-server (plain HTTP) ──────────────
# The chart only ships an Ingress for the server, which the gateway serves (ADR 0015).
# TLS ends at the edge, hence server.insecure.
argocd_ingress_class: traefik   # = k3s_gateway_class
argocd_vhost_entries:
  - hostname: "{{ argocd_hostname }}"
    upstream: "127.0.0.1:{{ k3s_gateway_http_port }}"
    # The edge retries while the gateway restarts instead of answering 502.
    lb_try_duration: 5s
    title: Argo CD
    description: GitOps deployments

# ── Single sign-on (ADR 0018) ────────────────────────────────────────────────────────
# Dex is disabled: the platform's issuer is the only broker. The client is declared in
# onebox_oidc_clients.argocd (redirect https://<argocd_hostname>/auth/callback); its id and
# secret are the secrets argocd_oidc_client_id / argocd_oidc_client_secret.
argocd_oidc_enabled: "{{ onebox_oidc_issuer | length > 0 }}"
argocd_oidc_issuer: "{{ onebox_oidc_issuer }}"
argocd_oidc_name: Single sign-on   # label of the login button
argocd_oidc_scopes: [openid, profile, email]
# PEM bundle to trust for the issuer and for HTTPS Git servers behind the edge. Empty = the
# system roots. Needed with edge_tls_mode internal or a private CA in files mode.
argocd_ca_file: "{{ onebox_edge_ca_file | default('') }}"

# Local `admin` (password form on the login page): the break-glass path that does not depend
# on the SSO chain. Its password is generated by Argo CD on first install
# (secret argocd-initial-admin-secret) — a bcrypt hash in our secrets would change on every
# render (new salt) and restart the server on every converge.
# Turning it off is a three-step cutover (ADR 0009): put yourself in argocd_rbac_admins →
# sign in through SSO and *sync something* → only then set this to false. The preflight
# refuses false while argocd_rbac_admins is empty. Turning it back on is the break-glass.
argocd_local_admin_enabled: true

# ── RBAC ─────────────────────────────────────────────────────────────────────────────
# Subjects are OIDC group names or e-mail addresses (scopes: groups, email), matched
# literally — grant only to people who have signed in once (ADR 0018).
# Role for every signed-in user not listed below. "" denies everything.
argocd_rbac_default_role: role:readonly
argocd_rbac_admins: []        # role:admin — platform operators
argocd_rbac_readers: []       # role:readonly — useful when the default role is ""
# Per tenant: read-only plus sync on <tenant>/* (role:<tenant>-syncer).
#   - {subject: dev-team-demo, tenant: demo}
argocd_rbac_syncers: []

# ── Tenants (ADR 0016) ───────────────────────────────────────────────────────────────
# One entry per tenant, and nothing else to keep in sync — each entry yields:
#   AppProject <name>            sources: the tenant's repositories; destinations: <name>-*
#                                namespaces; cluster-scoped kinds: Namespace only
#   Application <name>-root      app-of-apps pointer at <repo>/<path>, in the platform-owned
#                                project platform-roots (it may only create Applications)
#   role:<name>-syncer           for argocd_rbac_syncers
# Name: lowercase letters/digits, ≤12 characters (composed names stay under 63).
#   - name: demo
#     repo: https://gitlab.dev.example.com/demo/gitops.git
#     path: applications          # default
#     revision: main              # default
#     source_repos: []            # more repositories the tenant may deploy from (Helm repos …)
#     namespaces: ["demo-*"]      # default ["<name>-*"]
#     cluster_resources: [{group: "", kind: Namespace}]   # default
argocd_tenants: []
# Lock the built-in `default` project (empty sources, destinations and cluster whitelist):
# otherwise `project: default` bypasses every tenant boundary. When moving existing
# Applications off `default`, set false, move them, then lock (ADR 0016).
argocd_lock_default_project: true

# ── Repository credentials ───────────────────────────────────────────────────────────
# Credential templates: the URL is a prefix match. Use read-only deploy tokens
# (read_repository). The entry names the *variable* holding the token, never the token, so the
# list can be checked and printed safely:
#   - name: demo-gitops
#     url: https://gitlab.dev.example.com/demo/gitops.git
#     username: argocd-demo
#     password_var: argocd_repo_demo_gitops_token     # key in secrets.yml
argocd_repo_credentials: []

# ── Components and resources ─────────────────────────────────────────────────────────
argocd_notifications_enabled: false
# The ApplicationSet controller cannot be disabled in this chart (no switch in its template).
# The host also runs services Kubernetes cannot see: every component gets a limit.
argocd_resources:
  controller:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  server:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  repoServer:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  applicationSet:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
  redis:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
# How long converge waits for the UI to answer through the gateway (first install pulls images).
argocd_ready_timeout: 600
