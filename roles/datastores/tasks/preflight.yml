---
# Run by roles/preflight before anything touches the host. No task here interpolates a
# secret: loops run over variable NAMES and values are only read inside `that:` (printed as
# written, never evaluated) — see CLAUDE.md §4.

- name: Assert the data network subnet is a CIDR
  ansible.builtin.assert:
    that:
      - onebox_data_subnet is match('^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$')
      - (onebox_data_subnet.split('/')[1] | int) <= 24
    fail_msg: "onebox_data_subnet must look like 10.89.10.0/24 (a /24 or larger: the default addresses use offsets up to 213)"
    quiet: true

- name: Assert the superuser and engine passwords are filled in
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | length > 0
      - lookup('ansible.builtin.vars', item, default='CHANGE-ME') is not match('CHANGE-ME')
    fail_msg: "secrets.yml: set {{ item }} (make secrets-gen KEY={{ item }})"
    quiet: true
  loop: >-
    {{ (['datastores_postgres_superuser_password'] if datastores_postgres_enabled | bool else [])
       + (['datastores_mysql_root_password'] if datastores_mysql_enabled | bool else [])
       + (['datastores_redis_password'] if datastores_redis_enabled | bool else [])
       + (['datastores_nats_password'] if datastores_nats_enabled | bool else [])
       + (['datastores_etcd_root_password'] if datastores_etcd_enabled | bool else []) }}

# The Redis password is read back from redis.conf by operational commands and usually ends up
# in redis:// URLs: unreserved URL characters only. make secrets-gen produces exactly those.
- name: Assert the Redis password uses URL-safe characters only
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', 'datastores_redis_password') is match('^[A-Za-z0-9._~-]+$')
    fail_msg: >-
      datastores_redis_password may only contain letters, digits and . _ ~ - (it is written
      unquoted into redis.conf and read back from there). Regenerate it: make secrets-gen
      KEY=datastores_redis_password
    quiet: true
  when: datastores_redis_enabled | bool

- name: Assert the Redis cluster has at least three distinct node addresses
  ansible.builtin.assert:
    that:
      - datastores_redis_ips | select | list | length >= 3
      - datastores_redis_ips | select | list | length == datastores_redis_ips | length
      - datastores_redis_ips | unique | length == datastores_redis_ips | length
    fail_msg: >-
      datastores_redis_ips needs at least three distinct, non-empty addresses: a Redis cluster
      refuses to form with fewer masters, and only after every container is already running
    quiet: true
  when: datastores_redis_enabled | bool

# A wrong address does not fail anywhere at deploy time: podman creates the container and an
# EndpointSlice pointing at it simply times out, far away from the cause.
- name: Assert the fixed addresses lie inside the data subnet
  ansible.builtin.assert:
    that:
      - item is match('^(\d{1,3}\.){3}\d{1,3}$')
      - (_ip_int | int) > (_datastores_net_int | int) + 1
      - (_ip_int | int) < (_datastores_net_int | int) + (_datastores_net_size | int) - 1
    fail_msg: >-
      {{ item }} is not a usable address in onebox_data_subnet {{ onebox_data_subnet }} (the
      network address, the gateway .1 and the broadcast address are excluded)
    quiet: true
  vars:
    _ip_octets: "{{ item.split('.') | map('int') | list }}"
    _ip_int: "{{ ((_ip_octets[0] * 256 + _ip_octets[1]) * 256 + _ip_octets[2]) * 256 + _ip_octets[3] }}"
  loop: "{{ _datastores_fixed_ips }}"

- name: Assert no two engines share an address
  ansible.builtin.assert:
    that:
      - _datastores_fixed_ips | unique | length == _datastores_fixed_ips | length
    fail_msg: "two enabled datastores have the same fixed address: {{ _datastores_fixed_ips | join(', ') }}"
    quiet: true

- name: Assert the published host ports do not collide
  ansible.builtin.assert:
    that:
      - _ports | unique | length == _ports | length
    fail_msg: "two datastores publish the same host port: {{ _ports | sort | join(', ') }}"
    quiet: true
  vars:
    _ports: >-
      {{ ([datastores_postgres_port | int] if datastores_postgres_enabled | bool else [])
         + ([datastores_mysql_port | int] if datastores_mysql_enabled | bool else [])
         + ([datastores_nats_port | int] if datastores_nats_enabled | bool else [])
         + ([datastores_etcd_port | int] if datastores_etcd_enabled | bool else [])
         + (_datastores_redis_ports if datastores_redis_enabled | bool else []) }}
    _datastores_redis_ports: >-
      {{ range(datastores_redis_port | int, (datastores_redis_port | int) + (datastores_redis_ips | length)) | list }}

# ── Application databases (declarations hold variable names, never values) ───────────
- name: Assert the database declarations are well-formed
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name is match('^[a-z_][a-z0-9_]{0,62}$')
      - item.owner is defined and item.owner is match('^[a-z_][a-z0-9_]{0,31}$')
      - item.password_var is defined and item.password_var is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: >-
      every entry of datastores_{{ item.engine }}_databases needs name and owner (lowercase
      letters, digits, _; not starting with a digit) and password_var (the NAME of a key in
      secrets.yml) — offending entry: {{ item.name | default('?') }}
    quiet: true
  loop: >-
    {{ ((datastores_postgres_databases | map('combine', {'engine': 'postgres'}) | list)
        if datastores_postgres_enabled | bool else [])
       + ((datastores_mysql_databases | map('combine', {'engine': 'mysql'}) | list)
          if datastores_mysql_enabled | bool else []) }}
  loop_control:
    label: "{{ item.engine }}: {{ item.name | default('?') }}"

- name: Assert database names are unique and each owner has one password
  ansible.builtin.assert:
    that:
      - item.dbs | map(attribute='name') | unique | length == item.dbs | length
      - item.dbs | map(attribute='owner') | unique | length
        == item.dbs | map(attribute='owner') | zip(item.dbs | map(attribute='password_var')) | map('join', '=') | unique | length
    fail_msg: >-
      datastores_{{ item.engine }}_databases lists a database twice, or gives one owner two
      different password_var keys
    quiet: true
  loop:
    - {engine: postgres, dbs: "{{ datastores_postgres_databases if datastores_postgres_enabled | bool else [] }}"}
    - {engine: mysql, dbs: "{{ datastores_mysql_databases if datastores_mysql_enabled | bool else [] }}"}
  loop_control:
    label: "{{ item.engine }}"

- name: Assert the application passwords are filled in
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | length > 0
      - lookup('ansible.builtin.vars', item, default='CHANGE-ME') is not match('CHANGE-ME')
    fail_msg: "secrets.yml: set {{ item }} (make secrets-gen KEY={{ item }}) — a database owner's password"
    quiet: true
  loop: >-
    {{ (((datastores_postgres_databases if datastores_postgres_enabled | bool else [])
         + (datastores_mysql_databases if datastores_mysql_enabled | bool else []))
        | map(attribute='password_var', default='') | select | unique | list) }}
