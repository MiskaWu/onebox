---
# Files this role writes (tests/render.yml runs this file in render mode).
- name: Manifests directory (render mode only; k3s creates it on a real host)
  ansible.builtin.file:
    path: "{{ onebox_root }}{{ _external_secrets_manifests_dir }}"
    state: directory
    mode: "0700"
  when: onebox_render_only | bool

- name: External Secrets HelmChart and OpenBao identity
  ansible.builtin.template:
    src: onebox-external-secrets.yaml.j2
    dest: "{{ onebox_root }}{{ _external_secrets_manifests_dir }}/onebox-external-secrets.yaml"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0600"

- name: ClusterSecretStore and pull-secret rules
  ansible.builtin.template:
    src: onebox-external-secrets-store.yaml.j2
    dest: "{{ onebox_root }}{{ _external_secrets_manifests_dir }}/onebox-external-secrets-store.yaml"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0600"
