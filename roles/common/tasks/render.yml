---
# Files this role writes. Included by main.yml and by tests/render.yml (render mode).

- name: Load OS-family values
  ansible.builtin.include_vars: "{{ onebox_os_family }}.yml"

- name: System directories (render mode only; they already exist on a real host)
  ansible.builtin.file:
    path: "{{ onebox_root }}{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ssh/sshd_config.d
    - "{{ common_smartd_config | dirname }}"
  when: onebox_render_only | bool

- name: Quadlet unit directory exists
  ansible.builtin.file:
    path: "{{ onebox_root }}/etc/containers/systemd"
    state: directory
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0755"

- name: Admin sshd port drop-in
  ansible.builtin.template:
    src: sshd-admin-port.conf.j2
    dest: "{{ onebox_root }}/etc/ssh/sshd_config.d/10-onebox-admin-port.conf"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0600"
  notify: Restart sshd
  when: _common_ssh_manage | default(true) | bool

- name: Write the smartd configuration
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: "{{ onebox_root }}{{ common_smartd_config }}"
    owner: "{{ onebox_owner }}"
    group: "{{ onebox_group }}"
    mode: "0644"
  notify: Restart smartd
  when: common_smartd_enabled | bool
