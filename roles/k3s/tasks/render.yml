---
# Everything this role writes (tests/render.yml runs this file in render mode).
# main.yml includes the two halves separately: the configuration must exist before k3s
# starts for the first time, the manifests directory only exists after it has started.
- name: Write the k3s configuration
  ansible.builtin.include_tasks: render_config.yml

- name: Write the cluster manifests
  ansible.builtin.include_tasks: render_manifests.yml
