---
# Passed by the service's play in site.yml:
#   caddy_vhost_name     drop-in file name (conf.d/<name>.caddy) and portal card name
#   caddy_vhost_entries  list of sites:
#     - hostname: gitlab.dev.example.com      required
#       upstream: 127.0.0.1:8081              required (host:port, or several separated by spaces)
#       title: GitLab                         portal card title (default: hostname)
#       description: Git forge               portal card text
#       portal: true                          list it on the portal page
#       internal_only: true                   default edge_internal_only_default
#       allow_cidrs: [10.0.0.0/8]             default onebox_lan_cidrs
#       lb_try_duration: 5s                   retry while the upstream restarts
#       stream_close_delay: 5m                keep WebSockets open across reloads
#       directives: ["encode zstd gzip"]      extra lines inside the site block
caddy_vhost_name: ""
caddy_vhost_entries: []
