---
# Raw TCP on a named entrypoint. The platform side, in the inventory:
#   k3s_gateway_tcp_entrypoints:
#     - {name: demo-mqtt, port: 1883}
# The entrypoint name is the contract: a name the gateway does not have creates no router, and
# nothing reports it. Without TLS there is no server name to route on, so the only possible
# match is HostSNI(`*`) — this port serves this one backend, one environment.
# (IngressRouteTCP is a Traefik resource; despite the name it has nothing to do with Ingress.)
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: demo-mqtt
spec:
  entryPoints:
    - demo-mqtt
  routes:
    - match: HostSNI(`*`)
      services:
        - name: demo-mqtt
          port: 1883
