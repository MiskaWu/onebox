---
# Values live in OpenBao; this only says which keys this service needs and how the resulting
# Secret looks. The store is the platform's (ClusterSecretStore openbao). Path layout:
# <tenant>/env/<tier> — here kv/demo/env/dev, field ui_message.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-api-secrets
  data:
    - secretKey: ui_message
      remoteRef:
        key: demo/env/dev
        property: ui_message
