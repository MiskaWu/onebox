---
# Routes a hostname to the Service through the platform's Gateway (gateway/onebox). New routes
# use HTTPRoute (portable, weighted backends); Ingress still works but is frozen upstream.
# No TLS here — the edge terminates it. The hostname must be one label under the apps domain
# (*.apps.<domain> is forwarded to the cluster and covered by the wildcard certificate);
# the overlay sets the real one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
spec:
  parentRefs:
    - name: onebox
      namespace: gateway
  hostnames:
    - demo-api.apps.dev.example.com
  rules:
    - backendRefs:
        - name: demo-api
          port: 80
