---
# Defaults for containers that declare no resources. The host also runs services the cluster
# cannot see; a container without limits can starve them.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
