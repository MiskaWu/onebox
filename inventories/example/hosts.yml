---
# One inventory directory per environment: copy this one with `make init ENV=<name>`.
# The `onebox` group is the platform host. Run on the host itself (default) or from a
# control machine over SSH (comment the first block, uncomment the second).
onebox:
  hosts:
    onebox-host:
      ansible_connection: local
#    onebox-host:
#      ansible_host: 192.0.2.10
#      ansible_user: you
#      ansible_port: 2222
