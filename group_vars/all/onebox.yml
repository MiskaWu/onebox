---
# Platform-wide defaults. Loaded for every play in site.yml.
#
# Override anything here from `inventories/<env>/group_vars/onebox/*.yml` — that directory
# has higher precedence than this file. Role-specific knobs live in each role's
# `defaults/main.yml`; only variables that more than one role reads are defined here.

# ── Environment ──────────────────────────────────────────────────────────────────────
onebox_env: example
# Every service gets `<name>.<onebox_domain>`. One wildcard DNS record
# (`*.<onebox_domain>` → onebox_host_ip) covers all of them.
onebox_domain: dev.example.com
# Address clients use to reach the host (LAN or public). 192.0.2.0/24 is TEST-NET-1.
onebox_host_ip: 192.0.2.10
# The LAN clients live on.
onebox_lan_cidrs:
  - 192.0.2.0/24
# Extra sources to treat as internal (a VPN, a peered network, …).
onebox_internal_extra_cidrs: []
# Sources the edge admits to internal-only vhosts: the LAN, plus — automatically — the k3s
# pod network (pods reach OpenBao, the OIDC issuer and Git through the edge) and the tailnet
# when those components run. Derived; set the inputs above, not this.
onebox_internal_cidrs: >-
  {{ (onebox_lan_cidrs
      + ([k3s_cluster_cidr] if ('k3s' in onebox_components and k3s_pods_trusted_by_edge | bool) else [])
      + (['100.64.0.0/10'] if 'tailscale' in onebox_components else [])
      + onebox_internal_extra_cidrs) | unique }}
# Contact address for ACME, Git forge notifications, etc.
onebox_admin_email: admin@example.com

# ── Components ───────────────────────────────────────────────────────────────────────
# What this host runs. `common` always runs and is not listed. Valid names and their
# dependencies are in onebox_component_requires below.
onebox_components: []

onebox_component_requires:
  operators: []
  storage: []
  tailscale: []
  edge: []
  datastores: []
  openbao: [edge]
  casdoor: [edge]
  gitlab: [edge]
  gitlab-runner: []
  k3s: []
  k3s-gateway: [k3s, edge]
  external-secrets: [k3s, openbao]
  argocd: [k3s, k3s-gateway]
  argo-rollouts: [k3s]

# ── Hostnames read by more than one role ─────────────────────────────────────────────
edge_portal_hostname: "{{ onebox_domain }}"
gitlab_hostname: "gitlab.{{ onebox_domain }}"
gitlab_registry_hostname: "registry.{{ onebox_domain }}"
casdoor_hostname: "sso.{{ onebox_domain }}"
openbao_hostname: "bao.{{ onebox_domain }}"
argocd_hostname: "argocd.{{ onebox_domain }}"

# ── Host baseline knobs read outside roles/common ────────────────────────────────────
# firewalld | none (cloud security groups or an external firewall)
common_firewall_backend: firewalld
# The host's own sshd. Move it off 22 when GitLab's git-over-SSH should own 22.
common_admin_ssh_port: 22

# ── Edge contract (read by caddy_edge and by caddy_vhost in every service play) ──────
edge_bin: /usr/local/bin/caddy
edge_config_dir: /etc/caddy
edge_confd_dir: /etc/caddy/conf.d
edge_data_dir: /var/lib/caddy
edge_portal_dir: /var/lib/caddy/portal
# unix: admin API on a 0700 unix socket (enables zero-downtime `caddy reload`)
# off : no admin API at all; every config change restarts Caddy
edge_admin_mode: unix
edge_admin_socket: /run/caddy/admin.sock
# Vhosts are LAN-only (403 for other sources) unless an entry sets internal_only: false.
edge_internal_only_default: true
# How the edge obtains certificates (details in roles/caddy_edge/defaults). Global because
# cluster roles read it: wildcard support, and which CA in-cluster clients must trust.
edge_tls_mode: acme_dns
# PEM bundle that clients inside the cluster (and containerd) must trust to reach the edge:
# empty for publicly trusted ACME certificates, Caddy's root for the internal CA. Point it at
# your CA bundle when edge_tls_mode is files with a private CA.
onebox_edge_ca_file: >-
  {{ (edge_data_dir ~ '/.local/share/caddy/pki/authorities/local/root.crt')
     if edge_tls_mode == 'internal' else '' }}

# ── Single sign-on ───────────────────────────────────────────────────────────────────
# OIDC issuer the services trust. Defaults to the bundled Casdoor; point it at any OIDC
# provider (Keycloak, Entra ID, Google Workspace, …) to run without the casdoor component.
onebox_oidc_issuer: "{{ ('https://' ~ casdoor_hostname) if 'casdoor' in onebox_components else '' }}"

# Every OIDC client the platform's services register at the identity provider. Casdoor
# (when enabled) creates these applications; each service reads its own entry. Client IDs
# and secrets are secrets: <name>_oidc_client_id / <name>_oidc_client_secret.
onebox_oidc_clients:
  gitlab:
    title: GitLab
    redirect_uris: ["https://{{ gitlab_hostname }}/users/auth/openid_connect/callback"]
  argocd:
    title: Argo CD
    redirect_uris: ["https://{{ argocd_hostname }}/auth/callback"]
  openbao:
    title: OpenBao
    redirect_uris:
      - "https://{{ openbao_hostname }}/ui/vault/auth/oidc/oidc/callback"
      - "http://localhost:8250/oidc/callback"   # `bao login -method=oidc` from a laptop

# ── OpenBao ↔ External Secrets contract ──────────────────────────────────────────────
openbao_kv_mount: kv
openbao_k8s_auth_mount: kubernetes
openbao_eso_role: external-secrets
external_secrets_namespace: external-secrets
external_secrets_service_account: external-secrets

# ── Shared runtime facts ─────────────────────────────────────────────────────────────
# OS family drives package names and paths (roles/common/vars/<family>.yml). Read from
# facts on a real host; render scenarios set it explicitly because facts are not gathered.
onebox_os_family: "{{ ansible_facts['os_family'] | default('unknown') }}"
# Private podman network the shared datastores and their client apps join.
onebox_data_network: onebox-data
onebox_data_subnet: 10.89.10.0/24
# podman's default bridge network: containers that join no named network (OpenBao, Casdoor's
# app container, …) talk to the host from here.
onebox_container_default_cidr: 10.88.0.0/16
# ── Cluster contract (roles/k3s, read by every cluster role) ─────────────────────────
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
# Must not overlap podman's networks (10.88.0.0/16 default, onebox_data_subnet) or the LAN.
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
# Narrowed from 30000-32767: kube-proxy DNATs NodePorts on 127.0.0.1 too, so a Service that
# drew the gateway's loopback port would silently capture the edge's traffic to it.
k3s_service_node_port_range: 30000-30999
# Pods keep their own address as source when they call the host, so the edge only admits them
# to internal-only vhosts through onebox_internal_cidrs. false = no pod may reach those vhosts.
k3s_pods_trusted_by_edge: true
# Loopback port the in-cluster gateway listens on; the edge proxies cluster hostnames here.
k3s_gateway_http_port: 31080

# ── Render mode (tests) ──────────────────────────────────────────────────────────────
# tests/render.yml sets onebox_render_only=true and onebox_root=<tmpdir>: every role's
# tasks/render.yml then writes its files under that directory instead of the host.
onebox_render_only: false
onebox_root: ""
onebox_owner: "{{ omit if onebox_render_only | bool else 'root' }}"
onebox_group: "{{ omit if onebox_render_only | bool else 'root' }}"
